name: DevSecOps

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  detect-changes:
    uses: ./.github/workflows/_detect-changes.yml

  build-test:
    uses: ./.github/workflows/_build-test.yml

  codeql:
    uses: ./.github/workflows/_sast.yml

  secret-scan:
    uses: ./.github/workflows/_secret-scan.yml

  iac-compliance:
    uses: ./.github/workflows/_iac-compliance.yml

  # Per-service container build, scan & sign

  build-auth-service:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.auth-service == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_container-build-sign.yml
    with:
      module: auth-service
      image:  sporterz-auth-service
    secrets: inherit

  build-api-gateway:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.api-gateway == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_container-build-sign.yml
    with:
      module: api-gateway
      image:  sporterz-api-gateway
    secrets: inherit

  build-posts-service:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.posts-service == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_container-build-sign.yml
    with:
      module: posts-service
      image:  sporterz-posts-service
    secrets: inherit

  build-match-service:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.match-service == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_container-build-sign.yml
    with:
      module: match-service
      image:  sporterz-match-service
    secrets: inherit

  build-messaging-service:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.messaging-service == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_container-build-sign.yml
    with:
      module: messaging-service
      image:  sporterz-messaging-service
    secrets: inherit

  # DAST
  dast-auth-service:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.auth-service == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_dast-zap.yml
    with:
      module: auth-service
      port:   8085
    secrets: inherit  # pragma: allowlist secret

  dast-api-gateway:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.api-gateway == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_dast-zap.yml
    with:
      module: api-gateway
      port:   8888
    secrets: inherit  # pragma: allowlist secret

  dast-posts-service:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.posts-service == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_dast-zap.yml
    with:
      module: posts-service
      port:   8081
    secrets: inherit  # pragma: allowlist secret

  dast-match-service:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.match-service == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_dast-zap.yml
    with:
      module: match-service
      port:   8082
    secrets: inherit  # pragma: allowlist secret

  dast-messaging-service:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.messaging-service == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_dast-zap.yml
    with:
      module: messaging-service
      port:   8083
    secrets: inherit  # pragma: allowlist secret

  # Snyk repo-wide scans
  snyk-security:
    needs: build-test
    uses: ./.github/workflows/_snyk-security.yml
    secrets: inherit

  # Security gate
  aggregate-and-govern:
    needs:
      - build-test
      - codeql
      - secret-scan
      - iac-compliance
      - build-auth-service
      - build-api-gateway
      - build-posts-service
      - build-match-service
      - build-messaging-service
      - dast-auth-service
      - dast-api-gateway
      - dast-posts-service
      - dast-match-service
      - dast-messaging-service
      - snyk-security
    if: always()
    uses: ./.github/workflows/_security-gate.yml
    with:
      max-critical: ${{ vars.MAX_CRITICAL || '999999' }}
      max-high:     ${{ vars.MAX_HIGH     || '999999' }}
      max-medium:   ${{ vars.MAX_MEDIUM   || '999999' }}
