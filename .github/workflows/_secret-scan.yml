name: Secrets Scan - Gitleaks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        run: |
          mkdir -p reports
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            zricethezav/gitleaks:latest \
            detect --source="/src" --redact --verbose \
            --config="/src/security/secret-scanning/.gitleaks.toml" \
            --report-format=json \
            --report-path=/src/reports/gitleaks.json
      - name: Show Gitleaks Report
        if: failure()
        run: |
          echo "=== Gitleaks Findings ==="
          cat reports/gitleaks.json 2>/dev/null || echo "No report generated"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-secrets
          path: reports
          if-no-files-found: warn
