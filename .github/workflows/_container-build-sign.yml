name: Container – Build, Scan and Sign

on:
  workflow_call:
    inputs:
      module:
        description: Maven module name, also used as the Docker build context (e.g. auth-service)
        required: true
        type: string
      image:
        description: Docker Hub image name without registry prefix (e.g. sporterz-auth-service)
        required: true
        type: string
      java-version:
        description: Java version for the Maven build
        required: false
        type: string
        default: "17"

permissions:
  contents: read
  security-events: write

jobs:
  build-sign-scan:
    name: ${{ inputs.module }}
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Build ${{ inputs.module }}
        run: |
          # Set service-specific secrets
          if [ "${{ inputs.module }}" = "posts-service" ]; then
            export POSTS_DB_URL="${{ secrets.POSTS_DB_URL }}"
          elif [ "${{ inputs.module }}" = "match-service" ]; then
            export MATCH_DB_URL="${{ secrets.MATCH_DB_URL }}"
            export APISPORTS_KEY="${{ secrets.APISPORTS_KEY }}"
          fi
          mvn -B -ntp -pl ${{ inputs.module }} -am -DskipTests package

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "${IMAGE_REF}" ${{ inputs.module }}
          docker push "${IMAGE_REF}"

      - run: mkdir -p reports

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: json
          output: reports/trivy-image-${{ inputs.module }}.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - uses: snyk/actions/setup@master

      - name: Snyk container scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          [ -z "${SNYK_TOKEN}" ] && echo "SNYK_TOKEN not set – skipping." && exit 0
          snyk auth "${SNYK_TOKEN}"
          snyk container test "${IMAGE_REF}" \
            --file=${{ inputs.module }}/Dockerfile \
            --severity-threshold=low \
            --json-file-output=reports/snyk-container-${{ inputs.module }}.json \
            --sarif-file-output=reports/snyk-container-${{ inputs.module }}.sarif || true

      - name: Upload Snyk container SARIF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="reports/snyk-container-${{ inputs.module }}.sarif"
          [ -f "$file" ] || exit 0
          gh api repos/${{ github.repository }}/code-scanning/sarifs \
            --method POST \
            --field ref="${{ github.ref }}" \
            --field commit_sha="${{ github.sha }}" \
            --field sarif="$(gzip -c "$file" | base64 -w0)" \
            --field category="snyk-container-${{ inputs.module }}"

      - uses: sigstore/cosign-installer@v3.6.0

      - name: Sign and verify image
        env:
          COSIGN_PASSWORD: ""
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > /tmp/cosign.key
          cosign sign --yes --key /tmp/cosign.key --tlog-upload=false "${IMAGE_REF}"
          rm -f /tmp/cosign.key
          cosign verify \
            --key security/keys/cosign.pub \
            --insecure-ignore-tlog \
            "${IMAGE_REF}" > reports/cosign-verify-${{ inputs.module }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-container-${{ inputs.module }}
          path: reports
          if-no-files-found: warn
