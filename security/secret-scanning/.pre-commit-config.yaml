repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: 'applicationset-sporterz\.yaml$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - security/secret-scanning/.secrets.baseline
          # Baseline in a subdir breaks detect-secrets is_baseline_file; exclude explicitly.
          - --exclude-files
          - (?i).*\.secrets\.baseline$
        exclude: (?i).*\.secrets\.baseline$
        additional_dependencies: ['urllib3==1.26.18']
