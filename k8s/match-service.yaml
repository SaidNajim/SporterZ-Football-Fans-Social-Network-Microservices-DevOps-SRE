apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-service
  namespace: default
  labels:
    app: match-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: match-service
  template:
    metadata:
      labels:
        app: match-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: match-service
          image: mrxmoon/sporterz-match-service:main  # Placeholder - ArgoCD Image Updater will set to commit SHA
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: match-service
spec:
  type: ClusterIP
  selector:
    app: match-service
  ports:
  - protocol: TCP
    port: 8082
    targetPort: 8082
