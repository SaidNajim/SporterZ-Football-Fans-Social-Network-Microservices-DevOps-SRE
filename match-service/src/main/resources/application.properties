spring.application.name=match-service

server.port=8082

spring.datasource.url=${MATCH_DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=${DB_TYPE:H2}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

apisports.key=${APISPORTS_KEY:}

management.endpoints.web.exposure.include=prometheus
